<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우니 ♥ 슷타 방학 생활 미션</title>

  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23ffb7c5'/><text y='.9em' x='5' font-size='85'>❤️</text></svg>">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23ffb7c5'/><text y='.9em' x='5' font-size='85'>❤️</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #fdf2f5;
      --card-bg: rgba(255, 255, 255, 0.95);
      --primary-color: #ffb7c5;
      --accent-color: #ff9aa2;
      --text-color: #5a4a42;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Jua', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      overflow-x: hidden;
      position: relative;
    }

    /* 은은하게 비처럼 내리는 하트 */
    .heart-rain {
      position: fixed;
      top: -10px;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .heart {
      position: absolute;
      color: #ffb3ba;
      opacity: 0.4;
      animation: fall linear infinite;
    }
    @keyframes fall {
      to { transform: translateY(105vh) rotate(360deg); }
    }

    .container {
      width: 100%;
      max-width: 480px;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 { font-size: 2rem; color: #f06292; margin-bottom: 5px; }

    /* 메인 사용자 선택 버튼 (우니/슷타/관리자) */
    .top-selector {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .btn-user {
      padding: 10px 20px;
      border: 3px solid #ffb7c5;
      border-radius: 25px;
      background: white;
      color: var(--text-color);
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-user.active {
      background-color: #ffb7c5;
      color: white;
    }

    /* 탭 메뉴 디자인 */
    .tab-menu {
      display: flex;
      gap: 4px;
      margin-bottom: 0px;
    }
    .tab-item {
      padding: 12px 6px;
      background: #eee;
      border-radius: 15px 15px 0 0;
      font-size: 0.95rem;
      color: #888;
      cursor: pointer;
      border: 2px solid transparent;
      border-bottom: none;
      flex: 1;
      text-align: center;
      transition: 0.3s;
      position: relative;
    }
    .tab-item.active {
      background: var(--card-bg);
      color: #f06292;
      border-color: #ffd3b6;
      font-weight: bold;
    }

    /* 카드형 컨텐츠 영역 */
    .content-box {
      background: var(--card-bg);
      border: 2px solid #ffd3b6;
      border-radius: 0 0 20px 20px;
      padding: 20px;
      min-height: 350px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .section-title { font-size: 1.3rem; margin-bottom: 15px; display: block; border-bottom: 2px solid #ffd3b6; padding-bottom: 5px; }

    /* 미션 리스트 스타일 */
    .mission-item { display: flex; align-items: center; margin-bottom: 12px; font-size: 1.1rem; }
    .mission-item input[type="checkbox"] { width: 22px; height: 22px; margin-right: 12px; accent-color: #f06292; cursor: pointer; }
    .mission-item.done span { text-decoration: line-through; color: #ccc; }

    /* 보상판 리스트 */
    .reward-item {
      padding: 10px;
      border-bottom: 1px dashed #ffd3b6;
      display: flex;
      justify-content: space-between;
      cursor: pointer;
      font-size: 1.1rem;
    }
    .reward-item.claimed .reward-text { text-decoration: line-through; color: #ff9aa2; }

    /* 달성도 프로그레스 바 */
    .progress-container { width: 100%; height: 20px; background: #eee; border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, #ffb7c5, #f06292); width: 0%; transition: 0.5s; }

    /* 응원 메시지 스타일 및 입력창 그룹 (모바일 폭 대응) */
    .cheer-display { background: #fff9fa; border-left: 5px solid #f06292; padding: 15px; border-radius: 10px; margin-bottom: 15px; font-size: 1.2rem; min-height: 60px; }
    
    .input-group { 
      display: flex; 
      gap: 6px; 
      width: 100%;
      box-sizing: border-box;
    }
    .input-group input { 
      flex: 1; 
      min-width: 0;
      padding: 10px; 
      border-radius: 8px; 
      border: 1px solid #ffd3b6; 
      font-size: 0.95rem; 
      outline: none; 
    }
    .input-group input.short-input {
      flex: 0 0 75px; /* 도장 수 입력창 너비 고정 및 반응형 유연성 유지 */
    }
    
    .btn-main { 
      padding: 10px 14px; 
      background: #ffaaa5; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 0.95rem; 
      white-space: nowrap;
    }
    .btn-main:disabled { background: #ccc; cursor: not-allowed; }

    /* 도장판 달력 */
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
    .cal-day { font-size: 0.8rem; color: #aaa; margin-bottom: 5px; }
    .date-cell { aspect-ratio: 1; background: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; position: relative; }
    .stamp { position: absolute; font-size: 1.2rem; color: #f06292; animation: pop 0.3s ease; }
    @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }

    /* 관리자 설정창 및 마감 안내 메시지 */
    .admin-select { width: 100%; padding: 10px; font-size: 1rem; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ffd3b6; }
    .notice-box { padding: 10px; border-radius: 8px; font-size: 0.95rem; margin-bottom: 15px; text-align: center; }
    .notice-box.open { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .notice-box.locked { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
    
    /* 순서 정렬 및 삭제 버튼 스타일 */
    .admin-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px dashed #eee;
    }
    .btn-order {
      background: #f0f0f0;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-left: 2px;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="heart-rain" id="heartContainer"></div>

  <div class="container">
    <header>
      <h1 id="mainTitle">우니 ♥ 슷타</h1>
      <p id="todayDate" style="color: #888;"></p>
    </header>

    <div class="top-selector">
      <button class="btn-user active" id="btnWooni">우니 👧</button>
      <button class="btn-user" id="btnSsta">슷타 👦</button>
      <button class="btn-user" id="btnAdmin">관리자 ⚙️</button>
    </div>

    <div id="tabs" class="tab-menu">
      <div class="tab-item active" data-tab="tabMission">오늘 미션</div>
      <div class="tab-item" data-tab="tabCheer" id="tabCheerBtn">상대 응원 <span id="cheerBadge"></span></div>
      <div class="tab-item" data-tab="tabStamp">도장판</div>
      <div class="tab-item" data-tab="tabReward">보상 목록</div>
    </div>

    <div id="mainContent" class="content-box">
      
      <div id="tabMission" class="tab-pane">
        <span class="section-title">🔥 오늘의 달성도 <span id="pctText">0%</span></span>
        <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
        <div id="missionList">데이터를 불러오는 중...</div>
      </div>

      <div id="tabCheer" class="tab-pane hidden">
        <span class="section-title">💌 도착한 응원</span>
        <div class="cheer-display" id="receivedCheer">"오늘도 고생했어! 사랑해❤️"</div>
        <div class="input-group">
          <input type="text" id="cheerInput" placeholder="응원을 남겨주세요!">
          <button class="btn-main" id="btnSendCheer">전송</button>
        </div>
      </div>

      <div id="tabStamp" class="tab-pane hidden">
        <span class="section-title">📅 이번 달 도장 현황</span>
        <div class="calendar" id="calendarBoard"></div>
        <p style="margin-top:15px; text-align:center; color:#f06292;" id="stampCount">지금까지 모은 도장: 0개</p>
      </div>

      <div id="tabReward" class="tab-pane hidden">
        <span class="section-title">🎁 우리들의 보상 (클릭해서 사용표시)</span>
        <div id="rewardList"></div>
      </div>

      <div id="tabAdmin" class="tab-pane hidden">
        <span class="section-title">⚙️ 관리자 설정</span>
        
        <div id="lockNotice" class="notice-box open">⏰ 매일 밤 10시 전까지 내일 미션을 작성해주세요!</div>

        <p style="margin-bottom:10px;">누구의 미션을 수정할까요?</p>
        <select class="admin-select" id="adminTarget">
          <option value="wooni">나는 슷타! (우니의 미션 쓰기)</option>
          <option value="ssta">나는 우니! (슷타의 미션 쓰기)</option>
        </select>
        
        <div class="input-group" style="margin-bottom:15px;">
          <input type="text" id="newMissionInput" placeholder="새 미션 입력">
          <button class="btn-main" id="btnAddMission">추가</button>
        </div>
        <div id="adminMissionList" style="margin-bottom:20px;"></div>

        <span class="section-title">🎁 공통 보상 설정</span>
        <div class="input-group" style="margin-bottom:15px;">
          <input type="number" id="rewardStamps" class="short-input" placeholder="도장수">
          <input type="text" id="rewardText" placeholder="보상 내용">
          <button class="btn-main" id="btnAddReward">등록</button>
        </div>
        <div id="adminRewardList"></div>
      </div>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // 1. 파이어베이스 설정
    const firebaseConfig = {
      apiKey: "AIzaSyA3MBjO_63bXwxKsbNj5iQCi2WZOQasjSA",
      authDomain: "vacation-routine.firebaseapp.com",
      databaseURL: "https://vacation-routine-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "vacation-routine",
      storageBucket: "vacation-routine.firebasestorage.app",
      messagingSenderId: "1091282686112",
      appId: "1:1091282686112:web:2bb3913509b67e873039c5"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const dbRef = ref(database, 'coupleAppData');

    // 한국 시간 계산 함수
    function getKSTDate() {
      const now = new Date();
      return new Date(now.getTime() + (9 * 60 * 60 * 1000 + now.getTimezoneOffset() * 60000));
    }
    
    function getTodayStr() {
      return getKSTDate().toISOString().split('T')[0];
    }

    // 밤 10시 수정 잠금 여부 판단 (밤 22시 이상이면 마감)
    function isMissionLocked() {
      return getKSTDate().getHours() >= 22;
    }

    // 기본 데이터 구조
    let db = {
      missions: {
        wooni: ["물 1리터 마시기", "영양제 먹기", "스트레칭 10분"],
        ssta: ["푸시업 30개", "독서 20분", "사랑한다고 말하기"]
      },
      dailyChecks: {}, // { "2026-07-30_wooni_0": true }
      cheers: { wooni: { text: "오늘도 화이팅!", read: true }, ssta: { text: "힘내자 우리!", read: true } },
      stamps: { wooni: [], ssta: [] },
      rewards: [
        { stamps: 10, text: "맛있는 커피 사주기", claimed: false },
        { stamps: 20, text: "영화 데이트 가기", claimed: false }
      ]
    };

    let currentUser = 'wooni';
    let currentTab = 'tabMission';

    function saveDB() {
      set(dbRef, db);
    }

    // 파이어베이스 데이터 실시간 동기화
    onValue(dbRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        db = data;
        if (!db.missions) db.missions = { wooni: [], ssta: [] };
        if (!db.dailyChecks) db.dailyChecks = {};
        if (!db.cheers) db.cheers = { wooni: { text: "", read: true }, ssta: { text: "", read: true } };
        if (!db.stamps) db.stamps = { wooni: [], ssta: [] };
        if (!db.rewards) db.rewards = [];
      } else {
        saveDB();
      }
      render();
    });

    function render() {
      updateCheerBadge();
      
      if (currentUser !== 'admin') {
        if (currentTab === 'tabMission') renderMissions();
        if (currentTab === 'tabCheer') renderCheers();
        if (currentTab === 'tabStamp') renderCalendar();
        if (currentTab === 'tabReward') renderRewards();
      } else {
        renderAdminMissions();
        renderAdminRewards();
      }
    }

    // 응원 도착 알림 이모티콘 뱃지 업데이트
    function updateCheerBadge() {
      const partner = currentUser === 'wooni' ? 'ssta' : 'wooni';
      const partnerCheer = db.cheers ? db.cheers[partner] : null;
      const badgeEl = document.getElementById('cheerBadge');
      
      if (partnerCheer && typeof partnerCheer === 'object' && !partnerCheer.read && partnerCheer.text) {
        badgeEl.innerText = "🔴";
      } else {
        badgeEl.innerText = "";
      }
    }

    function renderMissions() {
      const list = document.getElementById('missionList');
      list.innerHTML = '';
      const myMissions = db.missions[currentUser] || [];
      const todayStr = getTodayStr();
      let checked = 0;

      myMissions.forEach((m, i) => {
        // 날짜(todayStr)를 키로 사용하므로 다음날이 되면 체크가 초기화되어 새롭게 시작함
        const key = `${todayStr}_${currentUser}_${i}`;
        const isDone = !!db.dailyChecks[key];
        if (isDone) checked++;
        
        const item = document.createElement('div');
        item.className = `mission-item ${isDone ? 'done' : ''}`;
        item.innerHTML = `
          <input type="checkbox" ${isDone ? 'checked' : ''}>
          <span>${m}</span>
        `;
        item.querySelector('input').addEventListener('change', () => toggleMission(i));
        list.appendChild(item);
      });

      const pct = myMissions.length ? Math.round((checked / myMissions.length) * 100) : 0;
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('pctText').innerText = pct + '%';

      // 100% 달성 시 오늘 날짜 도장 부여
      if (pct === 100 && myMissions.length > 0) {
        if (!db.stamps[currentUser]) db.stamps[currentUser] = [];
        if (!db.stamps[currentUser].includes(todayStr)) {
          db.stamps[currentUser].push(todayStr);
          saveDB();
        }
      }
    }

    function toggleMission(i) {
      const todayStr = getTodayStr();
      const key = `${todayStr}_${currentUser}_${i}`;
      db.dailyChecks[key] = !db.dailyChecks[key];
      saveDB();
    }

    function renderCheers() {
      const partner = currentUser === 'wooni' ? 'ssta' : 'wooni';
      const cheerData = db.cheers[partner];
      
      let cheerText = "도착한 응원이 없어요!";
      if (typeof cheerData === 'string') {
        cheerText = cheerData;
      } else if (cheerData && cheerData.text) {
        cheerText = cheerData.text;
        // 응원 탭 열람 시 '읽음' 처리
        if (!cheerData.read) {
          db.cheers[partner].read = true;
          saveDB();
        }
      }

      document.getElementById('receivedCheer').innerText = `"${cheerText}"`;
    }

    function renderCalendar() {
      const board = document.getElementById('calendarBoard');
      board.innerHTML = '';
      const days = ['일','월','화','수','목','금','토'];
      days.forEach(d => board.innerHTML += `<div class="cal-day">${d}</div>`);

      const kst = getKSTDate();
      const firstDay = new Date(kst.getFullYear(), kst.getMonth(), 1).getDay();
      const lastDate = new Date(kst.getFullYear(), kst.getMonth() + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) board.innerHTML += `<div></div>`;
      
      const userStamps = db.stamps[currentUser] || [];
      for (let d = 1; d <= lastDate; d++) {
        const fullDate = `${kst.getFullYear()}-${String(kst.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const hasStamp = userStamps.includes(fullDate);
        board.innerHTML += `
          <div class="date-cell">
            ${d}
            ${hasStamp ? '<span class="stamp">❤️</span>' : ''}
          </div>`;
      }
      document.getElementById('stampCount').innerText = `이번 달 모은 도장: ${userStamps.length}개`;
    }

    function renderRewards() {
      const list = document.getElementById('rewardList');
      list.innerHTML = '';
      (db.rewards || []).forEach((r, i) => {
        const item = document.createElement('div');
        item.className = `reward-item ${r.claimed ? 'claimed' : ''}`;
        item.innerHTML = `
          <span class="reward-text">도장 ${r.stamps}개: ${r.text}</span>
          <span>${r.claimed ? '✅ 사용됨' : '🎁 미사용'}</span>
        `;
        item.addEventListener('click', () => {
          db.rewards[i].claimed = !db.rewards[i].claimed;
          saveDB();
        });
        list.appendChild(item);
      });
    }

    // 관리자 미션 수정 및 순서 재정렬 기능
    function renderAdminMissions() {
      const locked = isMissionLocked();
      const noticeBox = document.getElementById('lockNotice');
      const addBtn = document.getElementById('btnAddMission');
      const missionInput = document.getElementById('newMissionInput');

      if (locked) {
        noticeBox.className = "notice-box locked";
        noticeBox.innerText = "🔒 밤 10시가 지나 내일 미션 수정이 마감되었습니다.";
        addBtn.disabled = true;
        missionInput.disabled = true;
      } else {
        noticeBox.className = "notice-box open";
        noticeBox.innerText = "⏰ 매일 밤 10시 전까지 내일 미션을 작성해주세요!";
        addBtn.disabled = false;
        missionInput.disabled = false;
      }

      const target = document.getElementById('adminTarget').value;
      const list = document.getElementById('adminMissionList');
      list.innerHTML = '';
      
      const missionArr = db.missions[target] || [];
      
      missionArr.forEach((m, i) => {
        const item = document.createElement('div');
        item.className = 'admin-list-item';
        
        let controlBtns = '';
        if (!locked) {
          controlBtns = `
            <div>
              <button class="btn-order btn-up" ${i === 0 ? 'disabled' : ''}>▲</button>
              <button class="btn-order btn-down" ${i === missionArr.length - 1 ? 'disabled' : ''}>▼</button>
              <button class="btn-del" style="color:red; border:none; background:none; cursor:pointer; margin-left:5px;">[삭제]</button>
            </div>
          `;
        }

        item.innerHTML = `<span>- ${m}</span>${controlBtns}`;

        if (!locked) {
          // 위로 이동
          item.querySelector('.btn-up').addEventListener('click', () => moveMission(target, i, -1));
          // 아래로 이동
          item.querySelector('.btn-down').addEventListener('click', () => moveMission(target, i, 1));
          // 삭제
          item.querySelector('.btn-del').addEventListener('click', () => {
            db.missions[target].splice(i, 1);
            saveDB();
          });
        }
        list.appendChild(item);
      });
    }

    // 미션 순서 변경 함수
    function moveMission(target, index, direction) {
      const arr = db.missions[target];
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= arr.length) return;
      
      // 순서 맞바꾸기
      const temp = arr[index];
      arr[index] = arr[newIndex];
      arr[newIndex] = temp;
      
      saveDB();
    }

    function renderAdminRewards() {
      const list = document.getElementById('adminRewardList');
      list.innerHTML = '';
      (db.rewards || []).forEach((r, i) => {
        const item = document.createElement('div');
        item.className = 'admin-list-item';
        item.innerHTML = `<span>도장 ${r.stamps}개: ${r.text}</span> <button style="color:red; border:none; background:none; cursor:pointer;">[삭제]</button>`;
        item.querySelector('button').addEventListener('click', () => {
          db.rewards.splice(i, 1);
          saveDB();
        });
        list.appendChild(item);
      });
    }

    // 이벤트 리스너 설정
    document.getElementById('btnWooni').addEventListener('click', () => changeUser('wooni'));
    document.getElementById('btnSsta').addEventListener('click', () => changeUser('ssta'));
    document.getElementById('btnAdmin').addEventListener('click', () => changeUser('admin'));

    function changeUser(user) {
      currentUser = user;
      document.querySelectorAll('.btn-user').forEach(b => b.classList.remove('active'));
      if(user === 'wooni') document.getElementById('btnWooni').classList.add('active');
      if(user === 'ssta') document.getElementById('btnSsta').classList.add('active');
      if(user === 'admin') document.getElementById('btnAdmin').classList.add('active');

      const tabs = document.getElementById('tabs');
      if (user === 'admin') {
        tabs.classList.add('hidden');
        switchTab('tabAdmin');
      } else {
        tabs.classList.remove('hidden');
        switchTab('tabMission');
      }
    }

    document.querySelectorAll('.tab-item').forEach(tabEl => {
      tabEl.addEventListener('click', () => switchTab(tabEl.getAttribute('data-tab')));
    });

    function switchTab(tabId) {
      currentTab = tabId;
      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.add('hidden'));

      if (tabId !== 'tabAdmin') {
        const activeTab = document.querySelector(`.tab-item[data-tab="${tabId}"]`);
        if (activeTab) activeTab.classList.add('active');
      }
      document.getElementById(tabId).classList.remove('hidden');
      render();
    }

    document.getElementById('btnSendCheer').addEventListener('click', () => {
      const input = document.getElementById('cheerInput');
      if (!input.value.trim()) return;
      
      // 내 이름으로 응원 데이터 생성 (새 응원 알림을 위해 read: false 저장)
      db.cheers[currentUser] = {
        text: input.value.trim(),
        read: false
      };
      
      input.value = '';
      saveDB();
      alert('응원을 보냈어요!');
    });

    document.getElementById('adminTarget').addEventListener('change', renderAdminMissions);

    document.getElementById('btnAddMission').addEventListener('click', () => {
      if (isMissionLocked()) {
        alert('밤 10시가 지나 내일 미션을 작성할 수 없습니다.');
        return;
      }
      const target = document.getElementById('adminTarget').value;
      const input = document.getElementById('newMissionInput');
      if (!input.value.trim()) return;
      if (!db.missions[target]) db.missions[target] = [];
      db.missions[target].push(input.value.trim());
      input.value = '';
      saveDB();
    });

    document.getElementById('btnAddReward').addEventListener('click', () => {
      const s = document.getElementById('rewardStamps').value;
      const t = document.getElementById('rewardText').value.trim();
      if (!s || !t) return;
      if (!db.rewards) db.rewards = [];
      db.rewards.push({ stamps: Number(s), text: t, claimed: false });
      document.getElementById('rewardStamps').value = '';
      document.getElementById('rewardText').value = '';
      saveDB();
    });

    // 배경 하트 효과
    function createHearts() {
      const container = document.getElementById('heartContainer');
      for (let i = 0; i < 20; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerText = '❤️';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
        heart.style.animationDelay = Math.random() * 5 + 's';
        container.appendChild(heart);
      }
    }

    window.onload = () => {
      createHearts();
      const kst = getKSTDate();
      document.getElementById('todayDate').innerText = `${kst.getFullYear()}년 ${kst.getMonth()+1}월 ${kst.getDate()}일`;
    };
  </script>
</body>
</html>
